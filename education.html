<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Educational Attainment</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-light: #f0f0f0;
      --bg-dark: #121212;
      --card-light: #fff;
      --card-dark: #1e1e1e;
      --text-light: #333;
      --text-dark: #f0f0f0;
      --accent: #0070f3;
      --hover-accent: #005bb5;
      --gradient: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      --pattern-light: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="2" height="100" fill="%23cccccc"/><rect x="0" y="0" width="100" height="2" fill="%23cccccc"/><circle cx="25" cy="25" r="2" fill="%23cccccc"/><circle cx="75" cy="75" r="2" fill="%23cccccc"/></svg>');
      --pattern-dark: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="2" height="100" fill="%23333"/><rect x="0" y="0" width="100" height="2" fill="%23333"/><circle cx="25" cy="25" r="2" fill="%23333"/><circle cx="75" cy="75" r="2" fill="%23333"/></svg>');
    }

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg-light) var(--pattern-light);
      background-size: 150px 150px;
      color: var(--text-light);
      transition: all 0.4s ease;
      overflow: hidden; /* Disable scrolling */
    }

    body.dark-mode {
      background: var(--bg-dark) var(--pattern-dark);
      color: var(--text-dark);
    }

    .dark-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 50px;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s;
    }

    .dark-toggle:hover { background: var(--hover-accent); }

    .container {
      max-width: 1000px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: var(--accent);
      margin-bottom: 30px;
    }

    .card {
      background: var(--card-light);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s, background 0.4s;
      animation: fadeUp 0.8s ease forwards;
    }

    body.dark-mode .card { background: var(--card-dark); }

    .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.2); }

    .card h2 {
      margin-top: 0;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card p, .card li { font-size: 0.95em; margin: 5px 0; }
    .card li { list-style: none; padding-left: 20px; position: relative; }
    .card li::before { content: "\f058"; font-family: "Font Awesome 6 Free"; font-weight: 900; position: absolute; left: 0; color: var(--accent); }

    .back-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 16px;
      background: var(--gradient);
      color: #fff;
      text-decoration: none;
      border-radius: 50px;
      transition: all 0.3s;
    }

    .back-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--accent); }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 50px;
      height: 50px;
      margin-right: 10px;
    }

    .card h2 span {
      font-size: 0.95em; /* Same size as other dates */
      color: var(--accent); /* Inherit the same color as the university name */
    }
  </style>
</head>
<body>

<button class="dark-toggle" onclick="toggleDarkMode()">🌓</button>

<div class="container">
  <h1>Educational Attainment</h1>

  <div class="card">
    <h2><img src="uc.png" class="logo" alt="Uc Logo"> University of the Cordilleras <span>(August 2025 - Present)</span></h2>
    <p>Bachelor of Science in Computer Science</p>
  </div>

  <div class="card">
    <h2><img src="sti.png" class="logo" alt="STI Logo"> STI College Baguio (2021–2023)</h2>
    <p>Accountancy, Business, Management</p>
  </div>

  <div class="card">
    <h2><img src="bcnhs.png" class="logo" alt="Baguio City National High School Logo"> Baguio City National High School (2017–2021)</h2>
  </div>

  <div class="card">
    <h2><img src="mabini.png" class="logo" alt="Apolinario Mabini Elementary School Logo"> Apolinario Mabini Elementary School (2011–2017)</h2>
  </div>

  <a class="back-btn" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
</div>

<script>
  function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
  }
</script>

</body>
</html>
