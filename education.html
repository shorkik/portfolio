<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Educational Attainment</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-light: #f0f0f0;
      --bg-dark: #121212;
      --card-light: #fff;
      --card-dark: #1e1e1e;
      --text-light: #333;
      --text-dark: #f0f0f0;
      --accent: #0070f3;
      --hover-accent: #005bb5;
      --gradient: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      --pattern-light: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="2" height="100" fill="%23cccccc"/><rect x="0" y="0" width="100" height="2" fill="%23cccccc"/><circle cx="25" cy="25" r="2" fill="%23cccccc"/><circle cx="75" cy="75" r="2" fill="%23cccccc"/></svg>');
      --pattern-dark: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="2" height="100" fill="%23333"/><rect x="0" y="0" width="100" height="2" fill="%23333"/><circle cx="25" cy="25" r="2" fill="%23333"/><circle cx="75" cy="75" r="2" fill="%23333"/></svg>');
    }

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg-light) var(--pattern-light);
      background-size: 150px 150px; /* Restored the background pattern */
      color: var(--text-light);
      transition: all 0.4s ease;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      text-align: left;
      overflow: hidden; /* Prevent scrolling */
    }

    body.dark-mode {
      background: var(--bg-dark) var(--pattern-dark);
      color: var(--text-dark);
    }

    .container {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* Two columns */
      grid-gap: 10px; /* Reduced gap between cards */
      max-width: 1000px;
      margin-top: 20px; /* Reduced top margin */
      padding: 15px;
      background: none; /* Removed background */
    }

    h1 {
      text-align: center;
      color: var(--accent);
      font-size: 2rem; /* Reduced font size */
      margin-bottom: 15px;
      grid-column: span 2; /* Make the heading span both columns */
    }

    .card {
      background: var(--card-light);
      border-radius: 15px;
      padding: 15px; /* Reduced padding */
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 200px; /* Fixed height for cards */
    }

    body.dark-mode .card { background: var(--card-dark); }

    .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.2); }

    .card h2 {
      color: var(--accent);
      font-size: 1.3rem; /* Reduced heading font size */
      margin-bottom: 8px;
      text-align: center; /* Centered text for school name */
    }

    .card p {
      font-size: 1rem; /* Smaller font size */
      margin-bottom: 8px;
      text-align: center; /* Centered text for degree/program */
    }

    .logo {
      width: 60px; /* Smaller logo size */
      height: 60px;
      align-self: center; /* Center logo */
      margin-top: 10px; /* Reduced space between program and logo */
    }

    .button-row {
      display: flex;
      justify-content: space-between;
      margin-top: 10px; /* Reduced space above buttons */
      grid-column: span 2; /* Make buttons span both columns */
    }

    .nav-btn {
      padding: 12px 18px; /* Smaller button size */
      font-size: 14px; /* Smaller font size for buttons */
      background: var(--gradient);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.3s;
    }

    .nav-btn:hover {
      transform: scale(1.05);
    }

    /* Add responsiveness */
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr; /* Stack cards in one column on small screens */
      }

      .card {
        height: auto; /* Allow height to adjust for smaller screens */
      }
    }

  </style>
</head>
<body>

<div class="container">
  <h1>Educational Attainment</h1>

  <div class="card">
    <img src="uc.png" class="logo">
    <h2>University of the Cordilleras <span>(August 2025 - Present)</span></h2>
    <p>Bachelor of Science in Computer Science</p>
  </div>

  <div class="card">
    <img src="sti.png" class="logo">
    <h2>STI College Baguio (2021–2023)</h2>
    <p>Accountancy, Business, Management</p>
  </div>

  <div class="card">
    <img src="bcnhs.png" class="logo">
    <h2>Baguio City National High School (2017–2021)</h2>
    <p></p>
  </div>

  <div class="card">
    <img src="mabini.png" class="logo">
    <h2>Apolinario Mabini Elementary School (2011–2017)</h2>
    <p></p>
  </div>

  <div class="button-row">
    <a class="nav-btn" href="index.html">PREVIOUS</a>
    <a class="nav-btn" href="achievements.html">NEXT</a>
  </div>
</div>

<script>
  function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
  }
</script>

</body>
</html>
