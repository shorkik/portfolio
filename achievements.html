<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievements</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-light: #f0f0f0;
      --bg-dark: #121212;
      --card-light: #fff;
      --card-dark: #1e1e1e;
      --text-light: #333;
      --text-dark: #f0f0f0;
      --accent: #0070f3;
      --hover-accent: #005bb5;
      --gradient: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      --pattern-light: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="2" height="100" fill="%23cccccc"/><rect x="0" y="0" width="100" height="2" fill="%23cccccc"/><circle cx="25" cy="25" r="2" fill="%23cccccc"/><circle cx="75" cy="75" r="2" fill="%23cccccc"/></svg>');
      --pattern-dark: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="2" height="100" fill="%23333"/><rect x="0" y="0" width="100" height="2" fill="%23333"/><circle cx="25" cy="25" r="2" fill="%23333"/><circle cx="75" cy="75" r="2" fill="%23333"/></svg>');
    }

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg-light) var(--pattern-light);
      background-size: 150px 150px;
      color: var(--text-light);
      transition: all 0.4s ease;
      display: flex;
      justify-content: center; /* Center horizontally */
      align-items: center; /* Center vertically */
      height: 100vh; /* Full viewport height */
      overflow: hidden; /* Prevent scrolling */
    }

    body.dark-mode {
      background: var(--bg-dark) var(--pattern-dark);
      color: var(--text-dark);
    }

    .dark-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 50px;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s;
    }

    .dark-toggle:hover { background: var(--hover-accent); }

    .container {
      max-width: 1000px;
      margin: 0;
      padding: 10px;
    }

    h1 {
      text-align: center;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .grid {
      display: flex;
      justify-content: space-between;
      gap: 25px; /* Increased gap */
      flex-wrap: wrap; /* Allow wrapping on smaller screens */
      justify-content: center; /* Center the items horizontally */
    }

    .card {
      width: 30%; /* Increased width */
      background: var(--card-light);
      border-radius: 15px;
      padding: 20px; /* Increased padding */
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      transition: background 0.4s;
    }

    body.dark-mode .card {
      background: var(--card-dark);
    }

    .card img {
      width: 100%;
      height: 200px; /* Increased image size */
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px; /* Increased margin */
    }

    .caption {
      font-size: 1.2rem; /* Increased caption font size */
      font-weight: 600;
    }

    .button-row {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .nav-btn {
      padding: 12px 25px;
      font-size: 16px;
      background: var(--gradient);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.3s;
    }

    .nav-btn:hover {
      transform: scale(1.05);
    }

  </style>
</head>

<body>

<button class="dark-toggle" onclick="toggleDarkMode()">🌓</button>

<div class="container">

  <h1>Achievements</h1>

  <div class="grid">

    <div class="card">
      <img src="bball.png" alt="Basketball Achievement">
      <p class="caption">Runner Up – 3v3 Basketball 18U Women’s Division</p>
    </div>

    <div class="card">
      <img src="expo.png" alt="Expo Achievement">
      <p class="caption">Best Product Award – STI College SHS Expo</p>
    </div>

    <div class="card">
      <img src="expo1.png" alt="Expo Achievement 2">
      <p class="caption">1st Place – STI College Business Plan</p>
    </div>

    <div class="card">
      <img src="ssg.png" alt="Supreme Student Government">
      <p class="caption">Baguio City National Highschool SSG Member Grade 7-9 Representative</p>
    </div>

  </div>

  <div class="button-row">
    <a class="nav-btn" href="education.html">BACK</a>
    <a class="nav-btn" href="index.html">HOME</a>
  </div>

</div>

<script>
  function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
  }
</script>

</body>
</html>
