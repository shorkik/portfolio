<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Educational Attainment</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-light: #f0f0f0;
      --bg-dark: #121212;
      --card-light: #fff;
      --card-dark: #1e1e1e;
      --text-light: #333;
      --text-dark: #f0f0f0;
      --accent: #0070f3;
      --hover-accent: #005bb5;
      --gradient: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      --pattern-light: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="2" height="100" fill="%23cccccc"/><rect x="0" y="0" width="100" height="2" fill="%23cccccc"/><circle cx="25" cy="25" r="2" fill="%23cccccc"/><circle cx="75" cy="75" r="2" fill="%23cccccc"/></svg>');
      --pattern-dark: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="2" height="100" fill="%23333"/><rect x="0" y="0" width="100" height="2" fill="%23333"/><circle cx="25" cy="25" r="2" fill="%23333"/><circle cx="75" cy="75" r="2" fill="%23333"/></svg>');
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100vh;
      overflow: hidden;
    }

    /* PRELOADER */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #preloader.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .loader {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255,255,255,0.3);
      border-top: 5px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg-light) var(--pattern-light);
      background-size: 150px 150px;
      background-attachment: fixed;
      color: var(--text-light);
      transition: all 0.4s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }



    /* PAGE TRANSITION */
    .page-transition {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--gradient);
      z-index: 9998;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .page-transition.active {
      opacity: 1;
      visibility: visible;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 40px;
      min-height: 0;
      position: relative;
      z-index: 2;
    }

    h1 {
      text-align: center;
      color: var(--accent);
      font-size: 3rem;
      margin-bottom: 40px;
      text-shadow: 0 3px 6px rgba(0,0,0,0.15);
      position: relative;
    }

    /* ANIMATED UNDERLINE FOR H1 */
    h1::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 4px;
      background: var(--gradient);
      border-radius: 2px;
      animation: expandLine 1s ease forwards;
      animation-delay: 0.3s;
    }

    @keyframes expandLine {
      to {
        width: 200px;
      }
    }

    .container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 35px;
      max-width: 1500px;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .card {
      background: var(--card-light);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      opacity: 0;
      transform: translateY(50px);
      position: relative;
      overflow: hidden;
    }

    /* CARD SHINE EFFECT */
    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: rotate(45deg);
      transition: all 0.6s;
    }

    .card:hover::before {
      left: 100%;
    }

    /* GLOWING BORDER ANIMATION */
    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 20px;
      padding: 2px;
      background: var(--gradient);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover::after {
      opacity: 0.5;
    }

    .card.reveal {
      opacity: 1;
      transform: translateY(0);
      transition: all 0.8s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    /* SPARKLES AROUND LOGO */
    .logo-container {
      position: relative;
      margin-bottom: 25px;
    }

    .sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0;
      animation: sparkleAnim 2s ease-in-out infinite;
    }

    .card:hover .sparkle {
      animation: sparkleAnim 1.5s ease-in-out infinite;
    }

    @keyframes sparkleAnim {
      0%, 100% {
        opacity: 0;
        transform: scale(0) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: scale(1) rotate(180deg);
      }
    }

    .sparkle:nth-child(1) {
      top: 0;
      left: 0;
      animation-delay: 0s;
    }

    .sparkle:nth-child(2) {
      top: 0;
      right: 0;
      animation-delay: 0.5s;
    }

    .sparkle:nth-child(3) {
      bottom: 0;
      left: 0;
      animation-delay: 1s;
    }

    .sparkle:nth-child(4) {
      bottom: 0;
      right: 0;
      animation-delay: 1.5s;
    }

    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      transition: transform 0.3s;
      opacity: 0;
      transform: scale(0.8);
      filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2));
    }

    .logo.loaded {
      opacity: 1;
      transform: scale(1);
      transition: all 0.5s ease;
    }

    .card:hover .logo {
      transform: scale(1.15) rotate(360deg);
      transition: transform 0.6s ease;
    }

    .card h2 {
      color: var(--accent);
      font-size: 1.4rem;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .card h2 span {
      font-size: 1.1rem;
      color: var(--text-light);
      font-weight: 400;
      display: block;
      margin-top: 8px;
    }

    .card p {
      font-size: 1.15rem;
      color: var(--text-light);
      margin-top: auto;
    }

    .button-container {
      position: fixed;
      bottom: 30px;
      right: 30px;
      display: flex;
      gap: 15px;
      z-index: 100;
    }
    .nav-btn {
      padding: 16px 35px;
      font-size: 16px;
      font-weight: 700;
      background: var(--gradient);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    .nav-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      animation: fadeInUp 0.5s ease forwards;
    }

    .button-container {
      animation: fadeInUp 0.8s ease forwards;
      animation-delay: 0.3s;
      opacity: 0;
    }

    @media (max-height: 700px) {
      h1 {
        font-size: 2.2rem;
        margin-bottom: 30px;
      }
      .container {
        gap: 25px;
      }
      .card {
        padding: 25px 20px;
      }
      .logo {
        width: 70px;
        height: 70px;
      }
      .card h2 {
        font-size: 1.1rem;
      }
      .nav-btn {
        padding: 12px 25px;
        font-size: 14px;
      }
      .floating-book, .graduation-cap {
        display: none;
      }
      .floating-book, .graduation-cap {
        display: none;
      }
    }
  </style>
</head>
<body>

<!-- PRELOADER -->
<div id="preloader">
  <div class="loader"></div>
</div>

<!-- PAGE TRANSITION -->
<div class="page-transition"></div>

<div class="main-content">
  <h1>Educational Attainment</h1>

  <div class="container">
    <div class="card">
      <div class="logo-container">
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <img src="uc.png" class="logo loading" alt="UC Logo" onload="this.classList.add('loaded')">
      </div>
      <h2>University of the Cordilleras <span>(August 2025 - Present)</span></h2>
      <p>Bachelor of Science in Computer Science</p>
    </div>

    <div class="card">
      <div class="logo-container">
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <img src="sti.png" class="logo loading" alt="STI Logo" onload="this.classList.add('loaded')">
      </div>
      <h2>STI College Baguio <span>(2021–2023)</span></h2>
      <p>Accountancy, Business, Management</p>
    </div>

    <div class="card">
      <div class="logo-container">
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <img src="bcnhs.png" class="logo loading" alt="BCNHS Logo" onload="this.classList.add('loaded')">
      </div>
      <h2>Baguio City National High School <span>(2017–2021)</span></h2>
      <p></p>
    </div>

    <div class="card">
      <div class="logo-container">
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <img src="mabini.png" class="logo loading" alt="Mabini Logo" onload="this.classList.add('loaded')">
      </div>
      <h2>Apolinario Mabini Elementary School <span>(2011–2017)</span></h2>
      <p></p>
    </div>
  </div>
</div>

<div class="button-container">
  <a class="nav-btn" href="index.html" onclick="pageTransition(event, 'index.html')"><i class="fas fa-arrow-left"></i> PREVIOUS</a>
  <a class="nav-btn" href="achievements.html" onclick="pageTransition(event, 'achievements.html')">NEXT <i class="fas fa-arrow-right"></i></a>
</div>

<script>
  // PRELOADER - Faster
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('preloader').classList.add('hidden');
    }, 500);
  });

  // PAGE TRANSITION
  function pageTransition(event, url) {
    event.preventDefault();
    const transition = document.querySelector('.page-transition');
    transition.classList.add('active');
    setTimeout(() => {
      window.location.href = url;
    }, 400);
  }

  // SCROLL REVEAL FOR CARDS
  function revealCards() {
    const cards = document.querySelectorAll('.card');
    cards.forEach((card, index) => {
      setTimeout(() => {
        card.classList.add('reveal');
      }, index * 150);
    });
  }

  window.addEventListener('load', () => {
    setTimeout(revealCards, 600);
  });
</script>

</body>
</html>
